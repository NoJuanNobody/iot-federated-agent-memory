<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840">
  <defs>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="seq-arrow-open" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#555555" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111111; }
    .mono { font-family: "Courier New", Courier, monospace; }
    .title { font-size: 16px; font-weight: bold; }
    .subtitle { font-size: 11px; fill: #555555; }
    .actor-title { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .actor-sub { font-size: 9.5px; fill: #e0e0e0; }
    .phase-lbl { font-size: 10px; font-weight: bold; }
    .msg { font-size: 10px; }
    .note { font-size: 9.2px; }
    .small { font-size: 8.8px; fill: #555555; }
    .banner-white { font-size: 10.5px; font-weight: bold; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Figure Title -->
  <text x="480" y="26" text-anchor="middle" class="title">Partitioned Knowledge Graph Sync &amp; Conflict Resolution Sequence</text>
  <text x="480" y="44" text-anchor="middle" class="subtitle">Two edge agents reconciling concurrent LWWMap, ORSet, and MVRegister mutations via PrefixMerkleTree anti-entropy</text>

  <!-- Participant Lifelines -->
  <line x1="215" y1="106" x2="215" y2="812" stroke="#555555" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="745" y1="106" x2="745" y2="812" stroke="#555555" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- Participant Headers -->
  <rect x="75" y="60" width="280" height="46" rx="4" fill="#111111"/>
  <text x="215" y="80" text-anchor="middle" class="actor-title mono">agent-mac-backend</text>
  <text x="215" y="96" text-anchor="middle" class="actor-sub mono">Workstation | tc:k4m9x7q2...v2xq</text>

  <rect x="605" y="60" width="280" height="46" rx="4" fill="#111111"/>
  <text x="745" y="80" text-anchor="middle" class="actor-title mono">agent-pi-tests</text>
  <text x="745" y="96" text-anchor="middle" class="actor-sub mono">Raspberry Pi | tc:r7p2w4m8...n8wd</text>

  <!-- ==================== PHASE 1: INITIAL PARITY ==================== -->
  <rect x="120" y="120" width="720" height="32" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1.2"/>
  <text x="480" y="140" text-anchor="middle" class="phase-lbl">1. Initial Merkle Parity:  <tspan class="mono" font-weight="normal">root_hash() = 7a3f...c91e  |  vclock = {mac: 4, pi: 4}  |  0 divergent buckets</tspan></text>

  <!-- ==================== PHASE 2: NETWORK PARTITION ==================== -->
  <rect x="30" y="166" width="900" height="30" rx="2" fill="#e8e8e8" stroke="#111111" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="480" y="185" text-anchor="middle" class="phase-lbl">2. NETWORK PARTITION (disconnect()) — MultiPeerUDPTransport offline; signed deltas buffered in offline_queue</text>

  <!-- ==================== PHASE 3: CONCURRENT OFFLINE MUTATIONS ==================== -->
  <!-- Left box: agent-mac-backend -->
  <rect x="30" y="210" width="388" height="122" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="30" y="210" width="388" height="22" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1"/>
  <text x="40" y="225" class="phase-lbl">3a. Offline Mutations (agent-mac-backend)</text>
  <text x="40" y="247" class="note mono">update_entity_field("auth.py", "status", "refactored")</text>
  <text x="48" y="260" class="small">→ LWWMap field HLC tick; leaves sibling fields untouched</text>
  <text x="40" y="276" class="note mono">add_relation("auth.py", "uses", "jwt_v2")</text>
  <text x="48" y="289" class="small">→ ORSet dot mac:6 added to kg:edges</text>
  <text x="40" y="305" class="note mono">propose_decision("db_pool", "pgbouncer")</text>
  <text x="48" y="318" class="small">→ MVRegister vc={mac:7, pi:4} | root → 9c1b...40a2 (Ed25519 signed)</text>

  <!-- Partition divider symbol -->
  <line x1="480" y1="214" x2="480" y2="328" stroke="#555555" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="448" y="258" width="64" height="22" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
  <text x="480" y="273" text-anchor="middle" class="small" font-weight="bold">OFFLINE</text>

  <!-- Right box: agent-pi-tests -->
  <rect x="542" y="210" width="388" height="122" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="542" y="210" width="388" height="22" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1"/>
  <text x="552" y="225" class="phase-lbl">3b. Concurrent Offline Mutations (agent-pi-tests)</text>
  <text x="552" y="247" class="note mono">update_entity_field("auth.py", "coverage", "94%")</text>
  <text x="560" y="260" class="small">→ LWWMap distinct field HLC tick; merges cleanly</text>
  <text x="552" y="276" class="note mono">add_relation("test_auth.py", "verifies", "auth.py")</text>
  <text x="560" y="289" class="small">→ ORSet dot pi:6 added to kg:edges</text>
  <text x="552" y="305" class="note mono">propose_decision("db_pool", "asyncpg")</text>
  <text x="560" y="318" class="small">→ MVRegister vc={mac:4, pi:7} | root → e40d...88b7 (Ed25519 signed)</text>

  <!-- ==================== PHASE 4: RECONNECT & AUTH ==================== -->
  <rect x="30" y="346" width="900" height="26" rx="2" fill="#f4f4f4" stroke="#111111" stroke-width="1.2"/>
  <text x="480" y="363" text-anchor="middle" class="phase-lbl">4. RECONNECT — DecentralizedPeerDiscovery on_peer_rejoined → reconnect() / sync_with_peer()</text>

  <!-- Msg 4a: Root exchange -->
  <line x1="215" y1="398" x2="740" y2="398" stroke="#111111" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="480" y="391" text-anchor="middle" class="msg"><tspan font-weight="bold">4a.</tspan> Root Hash &amp; Framed Hello: <tspan class="mono">root=9c1b...40a2</tspan> (CRDT\x01\x00 + CRC32 + SHA-256 + Ed25519 sig)</text>

  <!-- Msg 4b: Verify & mismatch -->
  <line x1="745" y1="432" x2="220" y2="432" stroke="#111111" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="480" y="425" text-anchor="middle" class="msg"><tspan font-weight="bold">4b.</tspan> <tspan class="mono">TrustStore.resolve_verify_key()</tspan> OK; root mismatch (<tspan class="mono">9c1b... ≠ e40d...</tspan>) → start Merkle diff</text>

  <!-- ==================== PHASE 5: PREFIX MERKLE TREE DIFF ==================== -->
  <rect x="145" y="446" width="670" height="96" rx="3" fill="#f4f4f4" stroke="#555555" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="157" y="463" class="phase-lbl">5. PrefixMerkleTree Anti-Entropy Walk (16-way radix, depth 3)</text>

  <line x1="215" y1="486" x2="740" y2="486" stroke="#111111" stroke-width="1.4" marker-end="url(#seq-arrow)"/>
  <text x="480" y="479" text-anchor="middle" class="msg"><tspan font-weight="bold">5a.</tspan> <tspan class="mono">children_hashes(prefix)</tspan> — descend only mismatched hex nibbles (levels 1 → 2 → 3)</text>

  <line x1="745" y1="518" x2="220" y2="518" stroke="#111111" stroke-width="1.4" marker-end="url(#seq-arrow)"/>
  <text x="480" y="511" text-anchor="middle" class="msg"><tspan font-weight="bold">5b.</tspan> <tspan class="mono">bucket_entries(leaf)</tspan> → 3 divergent keys (<tspan class="mono">kg:entity:auth.py</tspan>, <tspan class="mono">kg:edges</tspan>, <tspan class="mono">kg:decision:db_pool</tspan>)</text>

  <text x="480" y="535" text-anchor="middle" class="small">Unchanged prefix subtrees skipped without payload transfer (up to 94.4% bandwidth reduction at N=25)</text>

  <!-- ==================== PHASE 6: DELTA EXCHANGE & CRDT MERGE ==================== -->
  <line x1="215" y1="572" x2="740" y2="572" stroke="#111111" stroke-width="1.6" marker-end="url(#seq-arrow)"/>
  <text x="480" y="565" text-anchor="middle" class="msg"><tspan font-weight="bold">6a.</tspan> Signed <tspan class="mono">CRDTDeltaMessage[]</tspan> (3 keys, Mac → Pi) → Ed25519 verify + <tspan class="mono">merge_remote_delta()</tspan></text>

  <line x1="745" y1="604" x2="220" y2="604" stroke="#111111" stroke-width="1.6" marker-end="url(#seq-arrow)"/>
  <text x="480" y="597" text-anchor="middle" class="msg"><tspan font-weight="bold">6b.</tspan> Signed <tspan class="mono">CRDTDeltaMessage[]</tspan> (3 keys, Pi → Mac) → Ed25519 verify + <tspan class="mono">merge_remote_delta()</tspan></text>

  <!-- Post-merge state summary box -->
  <rect x="60" y="618" width="840" height="44" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="480" y="635" text-anchor="middle" class="note"><tspan font-weight="bold">Semilattice Join Result (both replicas identical):</tspan>  <tspan class="mono">LWWMap</tspan> keeps <tspan class="mono">status="refactored"</tspan> &amp; <tspan class="mono">coverage="94%"</tspan> | <tspan class="mono">ORSet</tspan> keeps both edges</text>
  <text x="480" y="651" text-anchor="middle" class="note"><tspan class="mono" font-weight="bold">MVRegister Conflict Surfaced:</tspan> <tspan class="mono">kg:decision:db_pool = ["asyncpg", "pgbouncer"]</tspan> (concurrent vclocks; 0 silent drops)</text>

  <!-- ==================== PHASE 7: CONFLICT RESOLUTION & FINAL PARITY ==================== -->
  <rect x="30" y="676" width="420" height="54" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1.3"/>
  <text x="42" y="693" class="phase-lbl">7a. Explicit Conflict Resolution (agent-mac-backend)</text>
  <text x="42" y="709" class="note mono">list_conflicts() → propose_decision("db_pool", "pgbouncer+asyncpg")</text>
  <text x="42" y="722" class="small">New vclock {mac: 8, pi: 7} causally dominates both {mac: 7, pi: 4} and {mac: 4, pi: 7}</text>

  <line x1="215" y1="756" x2="740" y2="756" stroke="#111111" stroke-width="1.6" marker-end="url(#seq-arrow)"/>
  <text x="480" y="749" text-anchor="middle" class="msg"><tspan font-weight="bold">7b.</tspan> Signed resolution delta (<tspan class="mono">mvreg_merge</tspan>, <tspan class="mono">vc={mac:8, pi:7}</tspan>) → <tspan class="mono">_prune()</tspan> collapses siblings</text>

  <!-- Final Parity Banner -->
  <rect x="90" y="772" width="780" height="36" rx="4" fill="#111111"/>
  <text x="480" y="794" text-anchor="middle" class="banner-white">8. MERKLE PARITY ACHIEVED:  <tspan class="mono">root_hash() = 3f8a...d12c</tspan>  |  0 Lost Writes  |  0 Unresolved Conflicts</text>
</svg>
