<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="660" viewBox="0 0 1020 660">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1.5 L 1 5 L 10 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-sec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#555555"/>
    </marker>
  </defs>

  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111111; }
    .mono { font-family: "Courier New", Courier, monospace; }
    .title { font-size: 16px; font-weight: bold; }
    .subtitle { font-size: 11px; fill: #555555; }
    .node-hdr { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .node-sub { font-size: 9.5px; fill: #e0e0e0; }
    .sec-hdr { font-size: 10.5px; font-weight: bold; }
    .body { font-size: 9.5px; }
    .small { font-size: 8.5px; fill: #555555; }
    .bus-hdr { font-size: 11.5px; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Figure Title -->
  <text x="510" y="26" text-anchor="middle" class="title">TinCan Federated Agent Memory: Zero-Relay Edge Mesh Architecture</text>
  <text x="510" y="44" text-anchor="middle" class="subtitle">Three heterogeneous edge nodes synchronizing a CRDT Knowledge Graph via 16-way PrefixMerkleTree anti-entropy and Ed25519 signed deltas</text>

  <!-- ==================== EDGE NODE 1: MAC ==================== -->
  <g id="node-mac">
    <rect x="24" y="62" width="304" height="384" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <!-- Header -->
    <rect x="24" y="62" width="304" height="38" rx="5" fill="#111111"/>
    <rect x="24" y="92" width="304" height="8" fill="#111111"/>
    <text x="176" y="79" text-anchor="middle" class="node-hdr">Edge Node 1: Workstation (Mac)</text>
    <text x="176" y="94" text-anchor="middle" class="node-sub mono">agent-mac-backend | tc:k4m9x7q2...v2xq</text>

    <!-- Layer 1: FederatedAgentKnowledgeGraph -->
    <rect x="36" y="110" width="280" height="118" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1.2"/>
    <text x="46" y="126" class="sec-hdr mono">FederatedAgentKnowledgeGraph</text>
    <rect x="46" y="134" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="54" y="150" class="body"><tspan class="mono" font-weight="bold">LWWMap</tspan> — Entities (<tspan class="mono">kg:entity:&lt;id&gt;</tspan>, HLC)</text>
    <rect x="46" y="164" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="54" y="180" class="body"><tspan class="mono" font-weight="bold">ORSet</tspan> — Relations (<tspan class="mono">kg:edges</tspan>, <tspan class="mono">kg:index</tspan>)</text>
    <rect x="46" y="194" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="54" y="210" class="body"><tspan class="mono" font-weight="bold">MVRegister</tspan> — Decisions (<tspan class="mono">kg:decision:*</tspan>)</text>

    <!-- Layer 2: CRDTMeshGossipSync + PrefixMerkleTree -->
    <rect x="36" y="238" width="280" height="90" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="46" y="254" class="sec-hdr mono">CRDTMeshGossipSync</text>
    <rect x="46" y="262" width="146" height="56" rx="2" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="54" y="277" class="body mono" font-weight="bold">PrefixMerkleTree</text>
    <text x="54" y="291" class="small">16-way radix, depth 3</text>
    <text x="54" y="304" class="small">4096 buckets (SHA-256)</text>
    <rect x="200" y="262" width="106" height="56" rx="2" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="208" y="277" class="body mono" font-weight="bold">Clocks &amp; Log</text>
    <text x="208" y="291" class="small">VectorClock + HLC</text>
    <text x="208" y="304" class="small">offline_queue</text>

    <!-- Layer 3: TinCanIdentity + TrustStore -->
    <rect x="36" y="338" width="280" height="66" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1.2"/>
    <text x="46" y="354" class="sec-hdr">Cryptographic Identity &amp; Framing</text>
    <text x="46" y="370" class="body"><tspan class="mono" font-weight="bold">TinCanIdentity</tspan>: Ed25519 (<tspan class="mono">TINCAN-CRDT-DELTA-V1</tspan>)</text>
    <text x="46" y="385" class="body"><tspan class="mono" font-weight="bold">TrustStore</tspan>: pinned VerifyKeys + optional TOFU</text>
    <text x="46" y="398" class="small">Frame: 46B hdr (CRDT\x01\x00 + len + CRC32 + SHA-256)</text>

    <!-- Bottom interface badge -->
    <rect x="66" y="414" width="220" height="22" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="176" y="429" text-anchor="middle" class="small mono">CRDTDeltaMessage / Merkle Diff RPC</text>
  </g>

  <!-- ==================== EDGE NODE 2: RASPBERRY PI ==================== -->
  <g id="node-pi">
    <rect x="358" y="62" width="304" height="384" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <!-- Header -->
    <rect x="358" y="62" width="304" height="38" rx="5" fill="#111111"/>
    <rect x="358" y="92" width="304" height="8" fill="#111111"/>
    <text x="510" y="79" text-anchor="middle" class="node-hdr">Edge Node 2: Raspberry Pi (ARM64)</text>
    <text x="510" y="94" text-anchor="middle" class="node-sub mono">agent-pi-tests | tc:r7p2w4m8...n8wd</text>

    <!-- Layer 1 -->
    <rect x="370" y="110" width="280" height="118" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1.2"/>
    <text x="380" y="126" class="sec-hdr mono">FederatedAgentKnowledgeGraph</text>
    <rect x="380" y="134" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="388" y="150" class="body"><tspan class="mono" font-weight="bold">LWWMap</tspan> — Entities (<tspan class="mono">kg:entity:&lt;id&gt;</tspan>, HLC)</text>
    <rect x="380" y="164" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="388" y="180" class="body"><tspan class="mono" font-weight="bold">ORSet</tspan> — Relations (<tspan class="mono">kg:edges</tspan>, <tspan class="mono">kg:index</tspan>)</text>
    <rect x="380" y="194" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="388" y="210" class="body"><tspan class="mono" font-weight="bold">MVRegister</tspan> — Decisions (<tspan class="mono">kg:decision:*</tspan>)</text>

    <!-- Layer 2 -->
    <rect x="370" y="238" width="280" height="90" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="380" y="254" class="sec-hdr mono">CRDTMeshGossipSync</text>
    <rect x="380" y="262" width="146" height="56" rx="2" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="388" y="277" class="body mono" font-weight="bold">PrefixMerkleTree</text>
    <text x="388" y="291" class="small">16-way radix, depth 3</text>
    <text x="388" y="304" class="small">4096 buckets (SHA-256)</text>
    <rect x="534" y="262" width="106" height="56" rx="2" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="542" y="277" class="body mono" font-weight="bold">Clocks &amp; Log</text>
    <text x="542" y="291" class="small">VectorClock + HLC</text>
    <text x="542" y="304" class="small">offline_queue</text>

    <!-- Layer 3 -->
    <rect x="370" y="338" width="280" height="66" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1.2"/>
    <text x="380" y="354" class="sec-hdr">Cryptographic Identity &amp; Framing</text>
    <text x="380" y="370" class="body"><tspan class="mono" font-weight="bold">TinCanIdentity</tspan>: Ed25519 (<tspan class="mono">TINCAN-CRDT-DELTA-V1</tspan>)</text>
    <text x="380" y="385" class="body"><tspan class="mono" font-weight="bold">TrustStore</tspan>: pinned VerifyKeys + optional TOFU</text>
    <text x="380" y="398" class="small">Frame: 46B hdr (CRDT\x01\x00 + len + CRC32 + SHA-256)</text>

    <!-- Bottom interface badge -->
    <rect x="400" y="414" width="220" height="22" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="510" y="429" text-anchor="middle" class="small mono">CRDTDeltaMessage / Merkle Diff RPC</text>
  </g>

  <!-- ==================== EDGE NODE 3: LAPTOP ==================== -->
  <g id="node-laptop">
    <rect x="692" y="62" width="304" height="384" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <!-- Header -->
    <rect x="692" y="62" width="304" height="38" rx="5" fill="#111111"/>
    <rect x="692" y="92" width="304" height="8" fill="#111111"/>
    <text x="844" y="79" text-anchor="middle" class="node-hdr">Edge Node 3: Field Peer (Laptop)</text>
    <text x="844" y="94" text-anchor="middle" class="node-sub mono">agent-laptop-ops | tc:m3q8f6n1...h5yc</text>

    <!-- Layer 1 -->
    <rect x="704" y="110" width="280" height="118" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1.2"/>
    <text x="714" y="126" class="sec-hdr mono">FederatedAgentKnowledgeGraph</text>
    <rect x="714" y="134" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="722" y="150" class="body"><tspan class="mono" font-weight="bold">LWWMap</tspan> — Entities (<tspan class="mono">kg:entity:&lt;id&gt;</tspan>, HLC)</text>
    <rect x="714" y="164" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="722" y="180" class="body"><tspan class="mono" font-weight="bold">ORSet</tspan> — Relations (<tspan class="mono">kg:edges</tspan>, <tspan class="mono">kg:index</tspan>)</text>
    <rect x="714" y="194" width="260" height="25" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="722" y="210" class="body"><tspan class="mono" font-weight="bold">MVRegister</tspan> — Decisions (<tspan class="mono">kg:decision:*</tspan>)</text>

    <!-- Layer 2 -->
    <rect x="704" y="238" width="280" height="90" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="714" y="254" class="sec-hdr mono">CRDTMeshGossipSync</text>
    <rect x="714" y="262" width="146" height="56" rx="2" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="722" y="277" class="body mono" font-weight="bold">PrefixMerkleTree</text>
    <text x="722" y="291" class="small">16-way radix, depth 3</text>
    <text x="722" y="304" class="small">4096 buckets (SHA-256)</text>
    <rect x="868" y="262" width="106" height="56" rx="2" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="876" y="277" class="body mono" font-weight="bold">Clocks &amp; Log</text>
    <text x="876" y="291" class="small">VectorClock + HLC</text>
    <text x="876" y="304" class="small">offline_queue</text>

    <!-- Layer 3 -->
    <rect x="704" y="338" width="280" height="66" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="1.2"/>
    <text x="714" y="354" class="sec-hdr">Cryptographic Identity &amp; Framing</text>
    <text x="714" y="370" class="body"><tspan class="mono" font-weight="bold">TinCanIdentity</tspan>: Ed25519 (<tspan class="mono">TINCAN-CRDT-DELTA-V1</tspan>)</text>
    <text x="714" y="385" class="body"><tspan class="mono" font-weight="bold">TrustStore</tspan>: pinned VerifyKeys + optional TOFU</text>
    <text x="714" y="398" class="small">Frame: 46B hdr (CRDT\x01\x00 + len + CRC32 + SHA-256)</text>

    <!-- Bottom interface badge -->
    <rect x="734" y="414" width="220" height="22" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="844" y="429" text-anchor="middle" class="small mono">CRDTDeltaMessage / Merkle Diff RPC</text>
  </g>

  <!-- ==================== DIRECT MESH PEERING ARROWS ==================== -->
  <!-- Node 1 <-> Node 2 horizontal gossip indicator -->
  <line x1="330" y1="282" x2="356" y2="282" stroke="#555555" stroke-width="1.4" stroke-dasharray="3,2" marker-start="url(#arrow-sec)" marker-end="url(#arrow-sec)"/>
  <!-- Node 2 <-> Node 3 horizontal gossip indicator -->
  <line x1="664" y1="282" x2="690" y2="282" stroke="#555555" stroke-width="1.4" stroke-dasharray="3,2" marker-start="url(#arrow-sec)" marker-end="url(#arrow-sec)"/>

  <!-- Vertical transport attachment arrows -->
  <line x1="176" y1="448" x2="176" y2="486" stroke="#111111" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="184" y="472" class="small">UDP :41234</text>

  <line x1="510" y1="448" x2="510" y2="486" stroke="#111111" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="518" y="472" class="small">UDP :41234</text>

  <line x1="844" y1="448" x2="844" y2="486" stroke="#111111" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="852" y="472" class="small">UDP / RNS</text>

  <!-- ==================== ZERO-RELAY P2P LAYER ==================== -->
  <g id="p2p-layer">
    <rect x="24" y="490" width="972" height="152" rx="5" fill="#f4f4f4" stroke="#111111" stroke-width="1.6"/>
    <rect x="24" y="490" width="972" height="28" rx="5" fill="#e6e6e6" stroke="#111111" stroke-width="1.2"/>
    <text x="510" y="509" text-anchor="middle" class="bus-hdr">Zero-Relay Peer-to-Peer Transport &amp; Discovery Layer (No Central Server / No Cloud Broker)</text>

    <!-- Module 1: MultiPeerUDPTransport -->
    <rect x="38" y="528" width="306" height="102" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="50" y="546" class="sec-hdr mono">MultiPeerUDPTransport</text>
    <text x="50" y="562" class="body">• Real <tspan class="mono">AF_INET / SOCK_DGRAM</tspan> multi-peer fan-out</text>
    <text x="50" y="577" class="body">• Auto SAR (<tspan class="mono">!B3sIHH</tspan>, 12B hdr, MTU 1400B)</text>
    <text x="50" y="592" class="body">• RFC 5389 STUN + <tspan class="mono">PACKET_TYPE_PUNCH</tspan> NAT</text>
    <text x="50" y="607" class="small">Works over LAN, Wi-Fi Direct, &amp; B.A.T.M.A.N.-adv</text>

    <!-- Module 2: DecentralizedPeerDiscovery -->
    <rect x="358" y="528" width="304" height="102" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="370" y="546" class="sec-hdr mono">DecentralizedPeerDiscovery</text>
    <text x="370" y="562" class="body">• mDNS / DNS-SD (<tspan class="mono">_tincan-mesh._udp.local.</tspan>)</text>
    <text x="370" y="577" class="body">• Fallback UDP Multicast (<tspan class="mono">239.255.77.88:5354</tspan>)</text>
    <text x="370" y="592" class="body">• Beacon <tspan class="mono">TINCAN-DISC-V1</tspan> (join / TTL / rejoin)</text>
    <text x="370" y="607" class="small">Triggers automatic Merkle sync on peer rejoin</text>

    <!-- Module 3: ReticulumTransportChannel (Optional) -->
    <rect x="676" y="528" width="306" height="102" rx="3" fill="#ffffff" stroke="#555555" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="688" y="546" class="sec-hdr mono">ReticulumTransportChannel <tspan font-weight="normal" fill="#555555">(Optional)</tspan></text>
    <text x="688" y="562" class="body">• Off-grid Reticulum Network Stack (RNS)</text>
    <text x="688" y="577" class="body">• Non-IP LoRa (RNode), packet radio, serial</text>
    <text x="688" y="592" class="body">• Single-packet encrypted payload MTU 464B</text>
    <text x="688" y="607" class="small">Disaster-resilient multi-hop DTN transport</text>
  </g>
</svg>
