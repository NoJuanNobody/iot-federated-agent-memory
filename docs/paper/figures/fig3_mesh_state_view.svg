<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="690" viewBox="0 0 1020 690">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111111; }
    .mono { font-family: "Courier New", Courier, monospace; }
    .title { font-size: 16px; font-weight: bold; }
    .subtitle { font-size: 11px; fill: #555555; }
    .bar-txt { font-size: 10.5px; font-weight: bold; fill: #ffffff; }
    .bar-sub { font-size: 9.5px; fill: #e0e0e0; }
    .panel-hdr { font-size: 11px; font-weight: bold; }
    .th { font-size: 9px; font-weight: bold; fill: #111111; }
    .td { font-size: 8.8px; }
    .body { font-size: 9.5px; }
    .small { font-size: 8.5px; fill: #555555; }
    .badge-ok { font-size: 8px; font-weight: bold; fill: #ffffff; }
    .badge-warn { font-size: 8.5px; font-weight: bold; fill: #111111; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Figure Title -->
  <text x="510" y="25" text-anchor="middle" class="title">Local Mesh State Inspector — Monochrome Wireframe View</text>
  <text x="510" y="42" text-anchor="middle" class="subtitle">Read-only diagnostic view of 3-node topology, Ed25519 TrustStore badges, VectorClock/HLC status, Merkle parity, and MVRegister conflicts</text>

  <!-- Outer Application Frame -->
  <rect x="20" y="54" width="980" height="618" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>

  <!-- Top Bar -->
  <rect x="20" y="54" width="980" height="34" rx="6" fill="#111111"/>
  <rect x="20" y="80" width="980" height="8" fill="#111111"/>
  <text x="36" y="75" class="bar-txt">TinCan Mesh State Inspector  |  Local: <tspan class="mono">agent-mac-backend</tspan></text>
  <text x="984" y="75" text-anchor="end" class="bar-sub mono">mDNS: _tincan-mesh._udp.local.  |  UDP :41234  |  require_signatures=True</text>

  <!-- ==================== PANEL 1 (TOP-LEFT): 3-NODE TOPOLOGY MAP ==================== -->
  <g id="panel-topology">
    <rect x="34" y="102" width="446" height="264" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
    <rect x="34" y="102" width="446" height="26" rx="4" fill="#f4f4f4" stroke="#111111" stroke-width="1"/>
    <text x="46" y="119" class="panel-hdr">1. Mesh Topology Map (3 Active Edge Peers)</text>
    <text x="468" y="119" text-anchor="end" class="small mono">Zero-Relay P2P</text>

    <!-- Mesh Links -->
    <!-- Mac (257, 175) to Pi (140, 290) -->
    <line x1="230" y1="194" x2="156" y2="262" stroke="#111111" stroke-width="1.6"/>
    <rect x="136" y="218" width="94" height="16" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
    <text x="183" y="229" text-anchor="middle" class="small mono">UDP+SAR 1.8ms</text>

    <!-- Mac (257, 175) to Laptop (374, 290) -->
    <line x1="284" y1="194" x2="358" y2="262" stroke="#111111" stroke-width="1.6"/>
    <rect x="286" y="218" width="94" height="16" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
    <text x="333" y="229" text-anchor="middle" class="small mono">UDP+SAR 2.4ms</text>

    <!-- Pi (140, 290) to Laptop (374, 290) -->
    <line x1="216" y1="290" x2="298" y2="290" stroke="#555555" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="257" y="284" text-anchor="middle" class="small mono">UDP / RNS</text>

    <!-- Node A: Mac (Top Center) -->
    <rect x="172" y="142" width="170" height="52" rx="4" fill="#f4f4f4" stroke="#111111" stroke-width="1.6"/>
    <text x="257" y="158" text-anchor="middle" class="td mono" font-weight="bold">agent-mac-backend</text>
    <text x="257" y="171" text-anchor="middle" class="small">Mac (Local) • 192.168.1.14:41234</text>
    <text x="257" y="185" text-anchor="middle" class="small mono">tc:k4m9x7q2...v2xq [SELF]</text>

    <!-- Node B: Raspberry Pi (Bottom Left) -->
    <rect x="50" y="262" width="166" height="52" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
    <text x="133" y="278" text-anchor="middle" class="td mono" font-weight="bold">agent-pi-tests</text>
    <text x="133" y="291" text-anchor="middle" class="small">Raspberry Pi • 192.168.1.27:41234</text>
    <text x="133" y="305" text-anchor="middle" class="small mono">tc:r7p2w4m8...n8wd [PINNED]</text>

    <!-- Node C: Laptop (Bottom Right) -->
    <rect x="298" y="262" width="166" height="52" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
    <text x="381" y="278" text-anchor="middle" class="td mono" font-weight="bold">agent-laptop-ops</text>
    <text x="381" y="291" text-anchor="middle" class="small">Laptop • 192.168.1.33:41234</text>
    <text x="381" y="305" text-anchor="middle" class="small mono">tc:m3q8f6n1...h5yc [PINNED]</text>

    <!-- Merkle Parity Indicator Bar -->
    <rect x="46" y="328" width="422" height="26" rx="3" fill="#111111"/>
    <text x="58" y="345" class="bar-txt" style="font-size: 9.5px;">PrefixMerkleTree Parity: 3/3 ALIGNED</text>
    <text x="456" y="345" text-anchor="end" class="bar-sub mono">root: 8b4e19c0...9f21 (depth=3)</text>
  </g>

  <!-- ==================== PANEL 2 (TOP-RIGHT): IDENTITY, CLOCKS & MERKLE STATUS ==================== -->
  <g id="panel-status">
    <rect x="494" y="102" width="492" height="264" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
    <rect x="494" y="102" width="492" height="26" rx="4" fill="#f4f4f4" stroke="#111111" stroke-width="1"/>
    <text x="506" y="119" class="panel-hdr">2. Ed25519 Verification, Causality Clocks &amp; Merkle Root Status</text>

    <!-- Table Header -->
    <rect x="506" y="138" width="468" height="22" fill="#e8e8e8" stroke="#111111" stroke-width="0.9"/>
    <text x="514" y="153" class="th">Node ID</text>
    <text x="626" y="153" class="th">tc:&lt;base32&gt; (Ed25519)</text>
    <text x="774" y="153" class="th">VectorClock / HLC</text>
    <text x="898" y="153" class="th">Merkle Root</text>

    <!-- Row 1 -->
    <rect x="506" y="160" width="468" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
    <text x="514" y="177" class="td mono" font-weight="bold">agent-mac-backend</text>
    <text x="514" y="192" class="small">Mac (local)</text>
    <text x="626" y="177" class="td mono">tc:k4m9...v2xq</text>
    <rect x="626" y="183" width="66" height="14" rx="2" fill="#111111"/>
    <text x="659" y="193" text-anchor="middle" class="badge-ok">ED25519 OK</text>
    <text x="774" y="177" class="td mono">vc:{m:7,p:7,l:5}</text>
    <text x="774" y="192" class="small mono">hlc:1732219042:0</text>
    <text x="898" y="177" class="td mono">8b4e...9f21</text>
    <text x="898" y="192" class="small mono">[PARITY]</text>

    <!-- Row 2 -->
    <rect x="506" y="204" width="468" height="44" fill="#f4f4f4" stroke="#cccccc" stroke-width="0.8"/>
    <text x="514" y="221" class="td mono" font-weight="bold">agent-pi-tests</text>
    <text x="514" y="236" class="small">Raspberry Pi</text>
    <text x="626" y="221" class="td mono">tc:r7p2...n8wd</text>
    <rect x="626" y="227" width="66" height="14" rx="2" fill="#111111"/>
    <text x="659" y="237" text-anchor="middle" class="badge-ok">ED25519 OK</text>
    <text x="774" y="221" class="td mono">vc:{m:7,p:7,l:5}</text>
    <text x="774" y="236" class="small mono">hlc:1732219042:1</text>
    <text x="898" y="221" class="td mono">8b4e...9f21</text>
    <text x="898" y="236" class="small mono">[PARITY]</text>

    <!-- Row 3 -->
    <rect x="506" y="248" width="468" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
    <text x="514" y="265" class="td mono" font-weight="bold">agent-laptop-ops</text>
    <text x="514" y="280" class="small">Laptop</text>
    <text x="626" y="265" class="td mono">tc:m3q8...h5yc</text>
    <rect x="626" y="271" width="66" height="14" rx="2" fill="#111111"/>
    <text x="659" y="281" text-anchor="middle" class="badge-ok">ED25519 OK</text>
    <text x="774" y="265" class="td mono">vc:{m:7,p:7,l:5}</text>
    <text x="774" y="280" class="small mono">hlc:1732219041:2</text>
    <text x="898" y="265" class="td mono">8b4e...9f21</text>
    <text x="898" y="280" class="small mono">[PARITY]</text>

    <!-- Telemetry Strip -->
    <rect x="506" y="304" width="468" height="50" rx="3" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="516" y="321" class="body"><tspan font-weight="bold">PrefixMerkleTree:</tspan> 16-way radix, depth 3 (139 / 4096 active leaf buckets)</text>
    <text x="516" y="339" class="body"><tspan font-weight="bold">Sync Telemetry:</tspan>  keys=148  |  rejected_deltas=0  |  offline_queue=0  |  conflicts=1</text>
  </g>

  <!-- ==================== PANEL 3 (BOTTOM-LEFT): KNOWLEDGE GRAPH STATE ==================== -->
  <g id="panel-kg">
    <rect x="34" y="380" width="446" height="278" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
    <rect x="34" y="380" width="446" height="26" rx="4" fill="#f4f4f4" stroke="#111111" stroke-width="1"/>
    <text x="46" y="397" class="panel-hdr">3. Replicated Knowledge Graph (FederatedAgentKnowledgeGraph)</text>

    <!-- LWWMap Section -->
    <text x="46" y="424" class="th mono">LWWMap Entities (kg:entity:&lt;id&gt; — per-field HLC)</text>
    <rect x="46" y="431" width="422" height="52" rx="2" fill="#f4f4f4" stroke="#555555" stroke-width="0.9"/>
    <text x="54" y="446" class="td mono" font-weight="bold">kg:entity:auth.py</text>
    <text x="54" y="460" class="td mono">  status="refactored" (mac)  |  coverage="94%" (pi)</text>
    <text x="54" y="474" class="small mono">  type="module" | author_pubkey=tc:k4m9...v2xq</text>

    <rect x="46" y="489" width="422" height="38" rx="2" fill="#ffffff" stroke="#555555" stroke-width="0.9"/>
    <text x="54" y="504" class="td mono" font-weight="bold">kg:entity:jwt_v2</text>
    <text x="54" y="518" class="td mono">  alg="EdDSA" | state="verified" | last_author="agent-mac-backend"</text>

    <!-- ORSet Section -->
    <text x="46" y="546" class="th mono">ORSet Relations (kg:edges — add-wins triples)</text>
    <rect x="46" y="553" width="422" height="62" rx="2" fill="#f4f4f4" stroke="#555555" stroke-width="0.9"/>
    <text x="54" y="569" class="td mono">["auth.py",      "uses",     "jwt_v2"]   (dot: mac:6)</text>
    <text x="54" y="585" class="td mono">["test_auth.py", "verifies", "auth.py"]  (dot: pi:6)</text>
    <text x="54" y="601" class="td mono">["deploy.sh",    "targets",  "auth.py"]  (dot: laptop:4)</text>

    <!-- Entity Index Footer -->
    <text x="46" y="633" class="small mono">kg:index:entities (ORSet): ["auth.py", "deploy.sh", "jwt_v2", "test_auth.py"]</text>
    <text x="46" y="647" class="small">Tombstones: 0  |  All concurrent entity fields &amp; graph edges merged cleanly</text>
  </g>

  <!-- ==================== PANEL 4 (BOTTOM-RIGHT): LIVE CONFLICT INSPECTOR ==================== -->
  <g id="panel-conflicts">
    <rect x="494" y="380" width="492" height="278" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
    <rect x="494" y="380" width="492" height="26" rx="4" fill="#f4f4f4" stroke="#111111" stroke-width="1"/>
    <text x="506" y="397" class="panel-hdr">4. Live Knowledge Graph Conflict Inspector (MVRegister)</text>
    <rect x="876" y="385" width="98" height="16" rx="2" fill="#111111"/>
    <text x="925" y="396" text-anchor="middle" class="badge-ok">1 ACTIVE CONFLICT</text>

    <!-- Conflict Key Header -->
    <rect x="506" y="416" width="468" height="28" rx="2" fill="#e8e8e8" stroke="#111111" stroke-width="1"/>
    <text x="516" y="434" class="body mono" font-weight="bold">key: kg:decision:db_pool   <tspan font-weight="normal" fill="#555555">(has_conflict() == True | 2 siblings)</tspan></text>

    <!-- Sibling A -->
    <rect x="506" y="454" width="228" height="114" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <rect x="506" y="454" width="228" height="20" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="0.9"/>
    <text x="514" y="468" class="th">Sibling A — agent-mac-backend</text>
    <text x="514" y="488" class="body">Value: <tspan class="mono" font-weight="bold">"pgbouncer"</tspan></text>
    <text x="514" y="505" class="td mono">vclock: {mac: 7, pi: 4, l: 5}</text>
    <text x="514" y="522" class="small mono">signer: tc:k4m9...v2xq</text>
    <text x="514" y="538" class="small mono">sig: Ed25519 VERIFIED</text>
    <text x="514" y="556" class="small">Origin: offline partition write</text>

    <!-- Sibling B -->
    <rect x="746" y="454" width="228" height="114" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <rect x="746" y="454" width="228" height="20" rx="3" fill="#f4f4f4" stroke="#111111" stroke-width="0.9"/>
    <text x="754" y="468" class="th">Sibling B — agent-pi-tests</text>
    <text x="754" y="488" class="body">Value: <tspan class="mono" font-weight="bold">"asyncpg"</tspan></text>
    <text x="754" y="505" class="td mono">vclock: {mac: 4, pi: 7, l: 5}</text>
    <text x="754" y="522" class="small mono">signer: tc:r7p2...n8wd</text>
    <text x="754" y="538" class="small mono">sig: Ed25519 VERIFIED</text>
    <text x="754" y="556" class="small">Origin: offline partition write</text>

    <!-- Causal Analysis & Resolution Controls -->
    <rect x="506" y="578" width="468" height="68" rx="3" fill="#f4f4f4" stroke="#555555" stroke-width="1"/>
    <text x="516" y="595" class="body"><tspan font-weight="bold">Causal Order:</tspan> <tspan class="mono">CONCURRENT</tspan> — neither VectorClock dominates (0 silent drops)</text>
    <text x="516" y="610" class="small">Resolving writes a dominating vclock {mac: 8, pi: 7, l: 5} via propose_decision()</text>

    <!-- Wireframe Action Buttons -->
    <rect x="516" y="618" width="128" height="21" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
    <text x="580" y="632" text-anchor="middle" class="td">Keep "pgbouncer"</text>

    <rect x="654" y="618" width="116" height="21" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
    <text x="712" y="632" text-anchor="middle" class="td">Keep "asyncpg"</text>

    <rect x="780" y="618" width="184" height="21" rx="3" fill="#111111"/>
    <text x="872" y="632" text-anchor="middle" class="badge-ok" style="font-size: 8.8px;">Propose Merged Decision</text>
  </g>
</svg>
