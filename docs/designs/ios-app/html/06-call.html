<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TinCan · call</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="phone">

<div class="dirt" aria-hidden="true">
  <div class="dirt-washes call"></div>
  <svg class="fine" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <filter id="finecall" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="4" seed="27" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.88  0 0 0 0 0.76  0 0 0 0.7 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#finecall)"/>
  </svg>
  <svg class="coarse" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <filter id="coarsecall" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="44" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.78  0 0 0 0 0.62  0 0 0 0.55 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#coarsecall)"/>
  </svg>
</div>
<div class="vignette" aria-hidden="true"></div>

<div class="ui">

<div class="status">
  <div class="time">9:41</div>
  <div class="sys">
    <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="0.6"/>
      <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.6"/>
      <rect x="9" y="3" width="3" height="9" rx="0.6"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.6" opacity="0.35"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
      <rect x="0.6" y="1.2" width="20" height="9.6" rx="2.2" stroke="currentColor" stroke-width="1.2"/>
      <rect x="2.2" y="2.8" width="14.2" height="6.4" rx="1" fill="currentColor"/>
      <path d="M22.2 4.2v3.6c1.1-.6 1.1-3 0-3.6z" fill="currentColor"/>
    </svg>
  </div>
</div>

<div class="body">
  <div class="call">
    <div class="who">
      <p class="kicker">Room studio-review</p>
      <h2>Maya</h2>
      <p>03:24 · Direct path · STUN only</p>
    </div>
    <div class="stage-vid">
      <div class="live"><b></b> VIDEO</div>
      <div class="pip"></div>
      <div class="cap">Data channel open · sealed · screen share ready</div>
    </div>
    <div class="controls">
      <div class="ctl"><svg viewBox="0 0 22 22" fill="none"><rect x="8" y="3" width="6" height="10" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 10.5a5.5 5.5 0 0 0 11 0M11 16v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <div class="ctl"><svg viewBox="0 0 22 22" fill="none"><rect x="2.5" y="6" width="12.5" height="10" rx="2.4" stroke="currentColor" stroke-width="1.7"/><circle cx="8.7" cy="11" r="2.3" stroke="currentColor" stroke-width="1.6"/><path d="M15 9.2l4-2.2v8.2l-4-2.2V9.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div>

      <div class="ctl end"><svg viewBox="0 0 22 22" fill="none"><path d="M6 6l10 10M16 6L6 16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></div>
    </div>
  </div>
</div>

</div>
<div class="homebar"></div>
</div>
</body>
</html>
