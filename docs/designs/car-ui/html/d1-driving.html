<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TinCan OS · driving</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="stage">

<div class="dirt" aria-hidden="true">
  <div class="dirt-washes drive"></div>
  <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <filter id="graindriving" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.88  0 0 0 0 0.78  0 0 0 0.55 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#graindriving)"/>
  </svg>
</div>
<div class="vignette" aria-hidden="true"></div>

<div class="ui">

    <aside class="dock">
      <svg class="mark" viewBox="0 0 44 44" fill="none" aria-hidden="true">
  <path d="M29.2 11.2A13.2 13.2 0 1 0 30.4 20.8" stroke="#ece6da" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="30.3" cy="15.8" r="2" fill="#d0703f"/>
</svg>
      <div class="dock-list">
        <div class="dock-btn locked" aria-label="Launcher"><svg viewBox="0 0 34 34" fill="none"><rect x="5" y="5" width="10.5" height="10.5" rx="3" stroke="currentColor" stroke-width="2"/><rect x="18.5" y="5" width="10.5" height="10.5" rx="3" stroke="currentColor" stroke-width="2"/><rect x="5" y="18.5" width="10.5" height="10.5" rx="3" stroke="currentColor" stroke-width="2"/><rect x="18.5" y="18.5" width="10.5" height="10.5" rx="3" stroke="currentColor" stroke-width="2"/></svg></div><div class="dock-btn active" aria-label="Navigate"><svg viewBox="0 0 34 34" fill="none"><path d="M8 26V15a7 7 0 0 1 7-7h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M16 5l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="dock-btn" aria-label="Listen"><svg viewBox="0 0 34 34" fill="none"><path d="M8 22V12h4l8-5v20l-8-5H8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M23 13.5a6 6 0 0 1 0 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="dock-btn locked" aria-label="Dashcam"><svg viewBox="0 0 34 34" fill="none"><rect x="4" y="9" width="20" height="16" rx="4" stroke="currentColor" stroke-width="2"/><circle cx="14" cy="17" r="4" stroke="currentColor" stroke-width="2"/><path d="M24 14l6-3v12l-6-3v-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div><div class="dock-btn locked" aria-label="Spaces"><svg viewBox="0 0 34 34" fill="none"><circle cx="9" cy="17" r="4.2" stroke="currentColor" stroke-width="2"/><circle cx="25" cy="17" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M13.4 17h7.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="17" r="1.6" fill="currentColor"/></svg></div><div class="dock-btn locked" aria-label="Drivers"><svg viewBox="0 0 34 34" fill="none"><circle cx="17" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M6.5 27c1.6-5 5.2-7.5 10.5-7.5S25.9 22 27.5 27" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      </div>
    </aside>
<section class="main">
  <header class="status">
      <div class="time">9:41 PM</div>
      <div class="dot"></div>
      <div>Moving · glance only</div>
      <div class="grow"></div>
      <div class="pill kaki"><span class="rec"></span> REC 1:12:08</div>
      <div class="pill">Mesh · 3 peers sealed</div>
    </header>
  <div class="content">
    
    <article class="card nav-card">
      <div class="nav-top">
        <div class="turn"><svg viewBox="0 0 54 54" fill="none"><path d="M14 40V24a10 10 0 0 1 10-10h16" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><path d="M32 8l14 14-14 14" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="nav-copy">
          <p class="kicker">Next move</p>
          <h1>0.4 mi</h1>
          <p class="street">Right on Bloor Street West</p>
          <p class="then">Then continue 1.2 mi toward home</p>
        </div>
      </div>
      <div class="road" aria-hidden="true"><div class="lane"></div><div class="path"></div></div>
    </article>
    <aside class="side">
      <article class="card speed-card">
        <p class="kicker">Speed</p>
        <div class="num">28</div>
        <div class="unit">MPH</div>
        <p class="hint">Clip browser, spaces, and driver switch stay locked until you park.</p>
      </article>
      <article class="card media-card">
        <div class="media-art" aria-hidden="true"></div>
        <div class="media-copy">
          <h2>Night Drive</h2>
          <p>Open Signal</p>
        </div>
        <div class="play"><svg viewBox="0 0 28 28" fill="currentColor"><path d="M8 5.5v17l15-8.5L8 5.5z"/></svg></div>
      </article>
    </aside>
    
  </div>
</section>
</div>
</div>
</body>
</html>
