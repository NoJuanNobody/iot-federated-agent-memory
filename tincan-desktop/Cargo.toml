[package]
name = "tincan-desktop"
version = "2.2.0"
edition = "2021"
description = "TinCan Mesh OS Native Desktop Shell (Tauri 2) — every Cmd-K launcher window, native menu bar, offline local node & DESIGN.md themes"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
